# Checks every push and pull request (Python lint and tests, the dashboard, the SAM template), and
# deploys to AWS from the main branch once all of them pass.
#
# Only the deploy job has any AWS access. It logs in with OIDC (a short-lived role, no stored keys):
# see docs/ci-cd-setup.md for the one-time setup.
#
# It reads three repository secrets (the two role ARNs, which contain the AWS account id, and the
# alert email address). None is a credential. They are secrets only because GitHub prints a
# variable's value in the run log, and this repository's logs are public; a secret is masked.
#
# Actions are pinned to a full commit SHA, with the version in a comment, so a moved tag cannot
# change what runs here. Dependabot proposes updates.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read # read the code; nothing in this file needs more

# A newer push to the same branch replaces a run that is still going, except on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  SAM_CLI_TELEMETRY: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  python:
    name: Python (lint and tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12" # the Lambda runtime
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  dashboard:
    name: Dashboard (types, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  template:
    name: SAM template (validate and lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: aws-actions/setup-sam@341eee193f458fa5aae5d52c94b0c5cf3a1c5a52 # v3
        with:
          version: 1.166.2 # the version the template was developed and linted with
      - run: sam validate --lint --region ap-south-1

  deploy:
    name: Deploy to AWS (main only)
    needs: [python, dashboard, template]
    # Never for a pull request, a fork or another branch: only a push to main, after the checks.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm # builds the arm64 container image natively (public repositories: free)
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # lets this job ask GitHub for the identity token AWS checks
    # One deploy at a time. A second push waits; it never cancels a deploy that is half done.
    concurrency:
      group: deploy-aws
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_CFN_ROLE_ARN: ${{ secrets.AWS_CFN_ROLE_ARN }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
      API_ALLOWED_ORIGIN: ${{ vars.API_ALLOWED_ORIGIN }}
      DASHBOARD_DEV_ORIGIN: ${{ vars.DASHBOARD_DEV_ORIGIN }}
      STACK_NAME: gradeflow
    steps:
      - name: Check the deploy variables are set
        env:
          DEPLOY_ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          : "${DEPLOY_ROLE:?Set the repository secret AWS_DEPLOY_ROLE_ARN (see docs/ci-cd-setup.md)}"
          : "${AWS_CFN_ROLE_ARN:?Set the repository secret AWS_CFN_ROLE_ARN (see docs/ci-cd-setup.md)}"
          : "${AWS_REGION:?Set the repository variable AWS_REGION (see docs/ci-cd-setup.md)}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: aws-actions/setup-sam@341eee193f458fa5aae5d52c94b0c5cf3a1c5a52 # v3
        with:
          version: 1.166.2 # the same version the template job lints with
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-deploy-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Build and deploy the stack
        run: scripts/ci_deploy.sh
      - name: Publish the dashboard
        run: scripts/deploy_dashboard.sh
      - name: Smoke test the deployed site
        run: |
          DASHBOARD_URL=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --query "Stacks[0].Outputs[?OutputKey=='DashboardUrl'].OutputValue" --output text)
          python3 scripts/smoke_test.py --dashboard-url "$DASHBOARD_URL"
          {
            echo "### Deployed ${GITHUB_SHA::7} to $STACK_NAME"
            echo "- Dashboard: $DASHBOARD_URL"
          } >> "$GITHUB_STEP_SUMMARY"
