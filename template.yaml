AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  GradeFlow - serverless data pipeline for education analytics.
  Phase 7: S3 upload -> SQS (+DLQ) -> trigger Lambda (skips duplicates) -> Step Functions
  (validate, clean, stats, anomalies, store; failure branch quarantines, records FAILED and
  alerts) -> Parquet in S3 + DynamoDB. The anomalies step runs from a container image.
  An API Gateway REST API (API key required) serves the results and signs upload forms.
  A React dashboard is served privately from S3 through CloudFront (origin access control).

Metadata:
  cfn-lint:
    config:
      # SAM generates the API key and usage plan resources with a DependsOn that the linter
      # calls redundant (W3005). We cannot edit generated resources, and this is the only
      # check ignored.
      ignore_checks: [W3005]

Parameters:
  MinValidRatio:
    Type: Number
    Default: 0.8
    MinValue: 0
    MaxValue: 1
    Description: Minimum share of valid rows for a dataset to be COMPLETED (0-1).
  PassMark:
    Type: Number
    Default: 50
    MinValue: 0
    MaxValue: 100
    Description: Scores at or above this count as a pass (0-100).
  ZScoreLimit:
    Type: Number
    Default: 3
    MinValue: 0.5
    MaxValue: 10
    Description: A score this many standard deviations from its subject and term is an anomaly.
  JumpThreshold:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 100
    Description: A change of more than this many points between consecutive terms is flagged.
  IfContamination:
    Type: Number
    Default: 0.05
    MinValue: 0.001
    MaxValue: 0.5
    Description: Share of students the Isolation Forest flags as unusual (0.05 = about 5%).
  MaxAnomalies:
    Type: Number
    Default: 500
    MinValue: 1
    MaxValue: 10000
    Description: Most findings stored per dataset (the true total is always recorded).
  AllowedOrigin:
    Type: String
    Default: "*"
    Description: >
      Website allowed to call the API from a browser (CORS), for example
      https://dashboard.example.com. The default * allows any site: fine while the data is
      synthetic and the API key is required, to be tightened once the dashboard has an address.
  DashboardDevOrigin:
    Type: String
    Default: "http://localhost:5173"
    AllowedPattern: '^$|^https?://[^/\s*]+$'
    ConstraintDescription: Leave empty, or give an origin such as http://localhost:5173 (no path, no wildcard).
    Description: >
      Extra website allowed to upload files straight to S3 from a browser, for running the
      dashboard on your own computer (npm run dev). The deployed dashboard is always allowed.
      Set it to an empty value to allow only the deployed dashboard.
  PandasLayerArn:
    Type: String
    # AWS SDK for pandas 3.17.1 (pandas, numpy, pyarrow), published by AWS for
    # ap-south-1 / Python 3.12 / arm64. List for other regions:
    # https://aws-sdk-pandas.readthedocs.io/en/stable/layers.html
    Default: arn:aws:lambda:ap-south-1:336392948345:layer:AWSSDKPandas-Python312-Arm64:31
    Description: ARN of the AWS SDK for pandas managed Lambda layer.
  AlertEmail:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[^@\s]+@[^@\s]+$'
    ConstraintDescription: Leave empty (no email) or give a valid address.
    Description: >
      Email address for failure alerts. Empty = the alert topic exists but nobody is
      subscribed. AWS sends a confirmation link you must click once.

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]
  HasDashboardDevOrigin: !Not [!Equals [!Ref DashboardDevOrigin, ""]]

Globals:
  # Only settings valid for BOTH zip and container-image functions. Runtime, CodeUri and Layers
  # are not allowed on an image function, so each zip function sets them itself.
  Function:
    Architectures: [arm64] # Graviton: ~20% cheaper than x86 for the same work
    MemorySize: 256
    Timeout: 60

Resources:
  # --- Storage ---------------------------------------------------------------------

  RawBucket:
    Type: AWS::S3::Bucket
    # S3 validates the queue's permissions when it creates the notification, so the queue
    # policy must exist first.
    DependsOn: UploadQueuePolicy
    Properties:
      # Account ID + region keep the name globally unique; resolved at deploy time.
      BucketName: !Sub "${AWS::StackName}-raw-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteRawFilesAfter30Days
            Status: Enabled
            ExpirationInDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt UploadQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/
      # The dashboard uploads with a browser POST to this bucket (a pre-signed form). Browsers
      # refuse that unless the bucket says the dashboard's origin may do it. Only POST, only
      # the deployed dashboard (and, optionally, a local dev server): never a wildcard.
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [POST]
            AllowedOrigins: !If
              - HasDashboardDevOrigin
              - - !Sub "https://${DashboardDistribution.DomainName}"
                - !Ref DashboardDevOrigin
              - - !Sub "https://${DashboardDistribution.DomainName}"
            AllowedHeaders: ["*"]
            MaxAge: 3600

  ProcessedBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Cleaned Parquet output (processed/<dataset_id>/data.parquet) is kept. The work/ files
      # that hand valid rows from Validate to Clean are temporary and expire.
      BucketName: !Sub "${AWS::StackName}-processed-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteWorkFilesAfter7Days
            Status: Enabled
            Prefix: work/
            ExpirationInDays: 7

  QuarantineBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Copies of rejected files: quarantine/<dataset_id>/<filename>. For inspection only.
      BucketName: !Sub "${AWS::StackName}-quarantine-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteQuarantinedFilesAfter30Days
            Status: Enabled
            ExpirationInDays: 30

  PipelineTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST # on-demand: pay per request, nothing when idle
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1 # list datasets by upload time
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection:
            ProjectionType: ALL

  # --- Queues ----------------------------------------------------------------------

  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600 # 14 days (the maximum) to investigate failures
      SqsManagedSseEnabled: true

  UploadQueue:
    Type: AWS::SQS::Queue
    Properties:
      # AWS recommends at least 6x the consumer's timeout (the trigger Lambda: 30 s).
      VisibilityTimeout: 180
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 3 # after 3 failed receives the message moves to the DLQ

  UploadQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref UploadQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowRawBucketToSendUploadEvents
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt UploadQueue.Arn
            Condition:
              # The bucket ARN is built as a string (not !GetAtt RawBucket.Arn): the bucket
              # depends on this policy, so referencing it would be a circular dependency.
              ArnEquals:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:s3:::${AWS::StackName}-raw-${AWS::AccountId}-${AWS::Region}"
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  # --- Alerts ----------------------------------------------------------------------

  AlertTopic:
    Type: AWS::SNS::Topic

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # --- Workflow --------------------------------------------------------------------

  PipelineStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: STANDARD # keeps a visual per-step history in the console
      DefinitionUri: statemachine/pipeline.asl.json
      DefinitionSubstitutions:
        ValidateFunctionArn: !GetAtt ValidateFunction.Arn
        CleanFunctionArn: !GetAtt CleanFunction.Arn
        StatsFunctionArn: !GetAtt StatsFunction.Arn
        AnomaliesFunctionArn: !GetAtt AnomaliesFunction.Arn
        StoreFunctionArn: !GetAtt StoreFunction.Arn
        FailFunctionArn: !GetAtt FailFunction.Arn
        AlertTopicArn: !Ref AlertTopic
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref ValidateFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref CleanFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref StatsFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref AnomaliesFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref StoreFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref FailFunction
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AlertTopic.TopicName

  # --- Functions: one per step, each with only the permissions its step needs -------

  TriggerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Reads each upload from SQS, skips duplicate files, starts the workflow.
      Handler: gradeflow.entrypoints.trigger_handler.handler
      Runtime: python3.12
      CodeUri: src/ # every zip Lambda shares the gradeflow package
      Layers:
        - !Ref PandasLayerArn # gradeflow.application imports pandas, so every function needs it
      MemorySize: 512 # holds the whole file in memory to fingerprint it (209 MB used at idle)
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref PipelineTable
          STATE_MACHINE_ARN: !Ref PipelineStateMachine
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref RawBucket
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem # hash claim, DUPLICATE and PROCESSING META
                - dynamodb:GetItem # read the owner of a claimed hash
              Resource: !GetAtt PipelineTable.Arn
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt PipelineStateMachine.Name
      Events:
        UploadedFile:
          Type: SQS
          Properties:
            Queue: !GetAtt UploadQueue.Arn
            BatchSize: 1 # one upload per call, so a failure retries exactly that upload

  ValidateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Workflow step 1, parses and validates the file, saves the valid rows.
      Handler: gradeflow.entrypoints.validate_handler.handler
      Runtime: python3.12
      CodeUri: src/ # every zip Lambda shares the gradeflow package
      Layers:
        - !Ref PandasLayerArn # gradeflow.application imports pandas, so every function needs it
      # The whole file is parsed into Python dicts. Measured about 1.4 MB per 1,000 rows
      # (a 50 MB CSV is roughly a million rows), on top of ~200 MB for the runtime and pandas.
      # Memory also scales CPU, so big files run faster, and the cost stays tiny.
      MemorySize: 2048
      Timeout: 120
      Environment:
        Variables:
          PROCESSED_BUCKET: !Ref ProcessedBucket
          MIN_VALID_RATIO: !Ref MinValidRatio
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref RawBucket
        - S3WritePolicy:
            BucketName: !Ref ProcessedBucket

  CleanFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Workflow step 2, cleans the valid rows and writes the Parquet file.
      Handler: gradeflow.entrypoints.clean_handler.handler
      Runtime: python3.12
      CodeUri: src/ # every zip Lambda shares the gradeflow package
      Layers:
        - !Ref PandasLayerArn # gradeflow.application imports pandas, so every function needs it
      MemorySize: 2048 # rows as dicts plus a DataFrame at the same time: the peak of the pipeline
      Timeout: 120
      Environment:
        Variables:
          PROCESSED_BUCKET: !Ref ProcessedBucket
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref ProcessedBucket
        - S3WritePolicy:
            BucketName: !Ref ProcessedBucket

  StatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Workflow step 3, computes statistics from the cleaned data.
      Handler: gradeflow.entrypoints.stats_handler.handler
      Runtime: python3.12
      CodeUri: src/ # every zip Lambda shares the gradeflow package
      Layers:
        - !Ref PandasLayerArn # gradeflow.application imports pandas, so every function needs it
      MemorySize: 1024 # a DataFrame of the clean rows
      Timeout: 120
      Environment:
        Variables:
          PROCESSED_BUCKET: !Ref ProcessedBucket
          PASS_MARK: !Ref PassMark
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref ProcessedBucket

  AnomaliesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Workflow step 4, finds anomalies with rules and an Isolation Forest.
      # scikit-learn is too big for a zip Lambda, so this one runs from a container image.
      # sam build builds it from docker/anomalies/Dockerfile; sam deploy pushes it to ECR.
      PackageType: Image
      ImageConfig:
        Command:
          - gradeflow.entrypoints.anomalies_handler.handler
      MemorySize: 2048 # the cleaned data as a DataFrame plus the forest (peaks near 1 GB at 525,000 rows)
      Timeout: 300
      Environment:
        Variables:
          PROCESSED_BUCKET: !Ref ProcessedBucket
          ZSCORE_LIMIT: !Ref ZScoreLimit
          JUMP_THRESHOLD: !Ref JumpThreshold
          IF_CONTAMINATION: !Ref IfContamination
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref ProcessedBucket
        - S3WritePolicy:
            BucketName: !Ref ProcessedBucket
    Metadata:
      Dockerfile: docker/anomalies/Dockerfile
      DockerContext: . # the repository root, so the Dockerfile can COPY src/gradeflow
      DockerTag: python3.12

  StoreFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Workflow step 4, saves statistics and marks the dataset COMPLETED.
      Handler: gradeflow.entrypoints.store_handler.handler
      Runtime: python3.12
      CodeUri: src/ # every zip Lambda shares the gradeflow package
      Layers:
        - !Ref PandasLayerArn # gradeflow.application imports pandas, so every function needs it
      Environment:
        Variables:
          TABLE_NAME: !Ref PipelineTable
          PROCESSED_BUCKET: !Ref ProcessedBucket
          MAX_ANOMALIES: !Ref MaxAnomalies
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem # META
                - dynamodb:Query # find the old STATS# and ANOMALY# items
                - dynamodb:DeleteItem # delete the old STATS# and ANOMALY# items
                - dynamodb:BatchWriteItem # batch_writer for stats and anomaly puts and deletes
              Resource: !GetAtt PipelineTable.Arn
        - Statement:
            - Effect: Allow
              Action: s3:GetObject # the anomalies file only, nothing else in the bucket
              Resource: !Sub "${ProcessedBucket.Arn}/work/*"

  FailFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Failure branch, quarantines a bad file and marks the dataset FAILED.
      Handler: gradeflow.entrypoints.fail_handler.handler
      Runtime: python3.12
      CodeUri: src/ # every zip Lambda shares the gradeflow package
      Layers:
        - !Ref PandasLayerArn # gradeflow.application imports pandas, so every function needs it
      Environment:
        Variables:
          TABLE_NAME: !Ref PipelineTable
          QUARANTINE_BUCKET: !Ref QuarantineBucket
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref RawBucket # the copy reads the original
        - S3WritePolicy:
            BucketName: !Ref QuarantineBucket
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem # META
              Resource: !GetAtt PipelineTable.Arn

  # --- Analytics API ---------------------------------------------------------------

  AnalyticsApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: v1 # URLs look like https://<id>.execute-api.<region>.amazonaws.com/v1/datasets
      # The key is required on each ROUTE (see ApiFunction's events), not on the whole API:
      # a browser's CORS preflight (OPTIONS) is sent without custom headers, so requiring the
      # key there would make every browser call fail with 403.
      Auth:
        UsagePlan:
          CreateUsagePlan: PER_API
          Description: Caps request rate and volume, so a leaked key cannot run up a bill.
          Throttle:
            # Sized to what the account can serve: a new AWS account allows only 10 concurrent
            # Lambda executions IN TOTAL, shared with the pipeline. Above that Lambda refuses
            # and API Gateway answers a confusing 500. A burst of 10 keeps the excess as a clear
            # 429 from the usage plan. Raise both after a Service Quotas increase for Lambda.
            RateLimit: 5 # requests per second
            BurstLimit: 10
          Quota:
            Limit: 5000
            Period: DAY
      Cors:
        AllowOrigin: !Sub "'${AllowedOrigin}'"
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Api-Key'"
        MaxAge: 600

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Serves the Analytics API (reads DynamoDB, signs upload forms for S3).
      Handler: gradeflow.entrypoints.api_handler.handler
      Runtime: python3.12
      CodeUri: src/
      # No pandas layer on purpose: this function only reads stored items, so it starts faster.
      Timeout: 15
      Environment:
        Variables:
          TABLE_NAME: !Ref PipelineTable
          RAW_BUCKET: !Ref RawBucket
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Policies:
        # Read-only: no Put, Delete, Update or Scan. The index is a separate resource.
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
              Resource:
                - !GetAtt PipelineTable.Arn
                - !Sub "${PipelineTable.Arn}/index/GSI1"
        # Only to sign upload forms: the form can then write one object under uploads/.
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${RawBucket.Arn}/uploads/*"
      Events:
        ListDatasets:
          Type: Api
          Properties: { RestApiId: !Ref AnalyticsApi, Path: /datasets, Auth: { ApiKeyRequired: true }, Method: GET }
        GetDataset:
          Type: Api
          Properties: { RestApiId: !Ref AnalyticsApi, Path: "/datasets/{id}", Auth: { ApiKeyRequired: true }, Method: GET }
        GetStats:
          Type: Api
          Properties: { RestApiId: !Ref AnalyticsApi, Path: "/datasets/{id}/stats", Auth: { ApiKeyRequired: true }, Method: GET }
        GetAnomalies:
          Type: Api
          Properties: { RestApiId: !Ref AnalyticsApi, Path: "/datasets/{id}/anomalies", Auth: { ApiKeyRequired: true }, Method: GET }
        CreateUpload:
          Type: Api
          Properties: { RestApiId: !Ref AnalyticsApi, Path: /uploads, Auth: { ApiKeyRequired: true }, Method: POST }

  # --- Dashboard hosting -----------------------------------------------------------
  # The React build is copied into a PRIVATE bucket (scripts/deploy_dashboard.sh). Only this
  # CloudFront distribution may read it, through an origin access control (OAC): nobody can
  # open the bucket directly, and every visitor gets HTTPS.

  DashboardBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-site-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  DashboardOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-dashboard"
        Description: Lets the dashboard distribution (and only it) read the dashboard bucket.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  DashboardBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DashboardBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowOnlyThisDistributionToRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${DashboardBucket.Arn}/*"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${DashboardDistribution}"

  DashboardHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-dashboard-headers"
        Comment: Browser security headers for the dashboard.
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: false
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: no-referrer
            Override: true
          # The page may load only its own files and talk only to its own origin, the API
          # and the raw bucket (uploads). The API host is a pattern (any API Gateway in this
          # region) because naming this stack's API would make the template circular
          # (API -> Lambda -> raw bucket -> distribution -> this policy). 'unsafe-inline' for
          # styles only: the charts set inline style attributes. No inline scripts.
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Sub >-
              default-src 'none';
              script-src 'self';
              style-src 'self' 'unsafe-inline';
              img-src 'self' data:;
              connect-src 'self' https://*.execute-api.${AWS::Region}.amazonaws.com https://${AWS::StackName}-raw-${AWS::AccountId}-${AWS::Region}.s3.${AWS::Region}.amazonaws.com;
              base-uri 'none';
              form-action 'none';
              frame-ancestors 'none'

  DashboardDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AWS::StackName} dashboard"
        DefaultRootObject: index.html
        PriceClass: PriceClass_100 # North America and Europe edges only: cheapest
        HttpVersion: http2
        IPV6Enabled: true
        Origins:
          - Id: dashboard-bucket
            DomainName: !GetAtt DashboardBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt DashboardOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: "" # empty: this origin uses OAC, not the legacy identity
        DefaultCacheBehavior:
          TargetOriginId: dashboard-bucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # AWS managed: CachingOptimized
          ResponseHeadersPolicyId: !Ref DashboardHeaders
        CacheBehaviors:
          # config.json holds the API address and key: never cache it, so a changed key or
          # address is picked up immediately.
          - PathPattern: config.json
            TargetOriginId: dashboard-bucket
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # AWS managed: CachingDisabled
            ResponseHeadersPolicyId: !Ref DashboardHeaders
        # No custom error pages on purpose: the dashboard uses #/ routes, so no path needs a
        # fallback to index.html, and a missing config.json must stay a clear 403, not an HTML
        # page the browser would fail to parse as JSON.

  # Log groups with a retention (the default is "never expire", which slowly costs money).
  TriggerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${TriggerFunction}"
      RetentionInDays: 14
  ValidateFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ValidateFunction}"
      RetentionInDays: 14
  CleanFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${CleanFunction}"
      RetentionInDays: 14
  StatsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${StatsFunction}"
      RetentionInDays: 14
  AnomaliesFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AnomaliesFunction}"
      RetentionInDays: 14
  StoreFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${StoreFunction}"
      RetentionInDays: 14
  FailFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${FailFunction}"
      RetentionInDays: 14
  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ApiFunction}"
      RetentionInDays: 14

Outputs:
  RawBucketName:
    Description: Upload files to s3://<this bucket>/uploads/<dataset_id>/<filename>
    Value: !Ref RawBucket
  ProcessedBucketName:
    Description: Cleaned data as Parquet, at processed/<dataset_id>/data.parquet
    Value: !Ref ProcessedBucket
  QuarantineBucketName:
    Description: Copies of rejected files, at quarantine/<dataset_id>/<filename>
    Value: !Ref QuarantineBucket
  UploadQueueUrl:
    Description: Queue that receives S3 upload events
    Value: !Ref UploadQueue
  DeadLetterQueueUrl:
    Description: Messages that failed 3 times end up here
    Value: !Ref DeadLetterQueue
  PipelineTableName:
    Description: DynamoDB table with dataset metadata and statistics
    Value: !Ref PipelineTable
  PipelineStateMachineArn:
    Description: The workflow; open it in the Step Functions console to see each run
    Value: !Ref PipelineStateMachine
  AlertTopicArn:
    Description: Failure alerts are published here
    Value: !Ref AlertTopic
  AnomaliesFunctionName:
    Description: Anomalies Lambda, a container image (check its logs in CloudWatch)
    Value: !Ref AnomaliesFunction
  ApiUrl:
    Description: Base URL of the Analytics API. Add a route, and send the x-api-key header.
    Value: !Sub "https://${AnalyticsApi}.execute-api.${AWS::Region}.amazonaws.com/v1"
  ApiKeyId:
    Description: >
      ID of the API key. Its value is a secret: fetch it with
      aws apigateway get-api-key --api-key <this id> --include-value --query value --output text
    Value: !Ref AnalyticsApiApiKey
  TriggerFunctionName:
    Description: Trigger Lambda (reads the queue; check its logs in CloudWatch)
    Value: !Ref TriggerFunction
  DashboardUrl:
    Description: Open this address to use the dashboard (HTTPS, served by CloudFront).
    Value: !Sub "https://${DashboardDistribution.DomainName}"
  DashboardBucketName:
    Description: Private bucket holding the dashboard build (filled by scripts/deploy_dashboard.sh)
    Value: !Ref DashboardBucket
  DashboardDistributionId:
    Description: CloudFront distribution of the dashboard (the deploy script invalidates its cache)
    Value: !Ref DashboardDistribution
