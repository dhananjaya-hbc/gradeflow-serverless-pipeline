AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  GradeFlow - serverless data pipeline for education analytics.
  Phase 2: S3 upload -> process Lambda (validate, clean, stats) -> Parquet in S3 + DynamoDB.

Parameters:
  MinValidRatio:
    Type: Number
    Default: 0.8
    MinValue: 0
    MaxValue: 1
    Description: Minimum share of valid rows for a dataset to be COMPLETED (0-1).
  PassMark:
    Type: Number
    Default: 50
    MinValue: 0
    MaxValue: 100
    Description: Scores at or above this count as a pass (0-100).
  PandasLayerArn:
    Type: String
    # AWS SDK for pandas 3.17.1 (pandas, numpy, pyarrow), published by AWS for
    # ap-south-1 / Python 3.12 / arm64. List for other regions:
    # https://aws-sdk-pandas.readthedocs.io/en/stable/layers.html
    Default: arn:aws:lambda:ap-south-1:336392948345:layer:AWSSDKPandas-Python312-Arm64:31
    Description: ARN of the AWS SDK for pandas managed Lambda layer.

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64] # Graviton: ~20% cheaper than x86 for the same work
    MemorySize: 256
    Timeout: 60
    CodeUri: src/ # every zip Lambda shares the gradeflow package

Resources:
  # --- Storage ---------------------------------------------------------------------

  RawBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Account ID + region keep the name globally unique; resolved at deploy time.
      BucketName: !Sub "${AWS::StackName}-raw-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteRawFilesAfter30Days
            Status: Enabled
            ExpirationInDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  ProcessedBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Cleaned Parquet output: processed/<dataset_id>/data.parquet. Kept (no expiry).
      BucketName: !Sub "${AWS::StackName}-processed-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  PipelineTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST # on-demand: pay per request, nothing when idle
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1 # list datasets by upload time
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection:
            ProjectionType: ALL

  # --- Processing ------------------------------------------------------------------

  ProcessFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Validates, cleans and summarises uploaded datasets.
      Handler: gradeflow.entrypoints.process_handler.handler
      MemorySize: 512 # pandas needs more memory; more memory also means more CPU
      Timeout: 120
      Layers:
        - !Ref PandasLayerArn
      Environment:
        Variables:
          TABLE_NAME: !Ref PipelineTable
          PROCESSED_BUCKET: !Ref ProcessedBucket
          MIN_VALID_RATIO: !Ref MinValidRatio
          PASS_MARK: !Ref PassMark
      Policies:
        # Least privilege: read only the raw bucket, write only the processed bucket
        # and this table.
        # The raw bucket name is built as a string (not !Ref RawBucket) to avoid a circular
        # dependency: the bucket already depends on this function for its event trigger.
        - S3ReadPolicy:
            BucketName: !Sub "${AWS::StackName}-raw-${AWS::AccountId}-${AWS::Region}"
        - S3WritePolicy:
            BucketName: !Ref ProcessedBucket
        - DynamoDBWritePolicy:
            TableName: !Ref PipelineTable
      Events:
        FileUploaded:
          Type: S3
          Properties:
            Bucket: !Ref RawBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/

  ProcessFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProcessFunction}"
      RetentionInDays: 14 # default is "never expire", which slowly costs money

Outputs:
  RawBucketName:
    Description: Upload files to s3://<this bucket>/uploads/<dataset_id>/<filename>
    Value: !Ref RawBucket
  ProcessedBucketName:
    Description: Cleaned data as Parquet, at processed/<dataset_id>/data.parquet
    Value: !Ref ProcessedBucket
  PipelineTableName:
    Description: DynamoDB table with dataset metadata and statistics
    Value: !Ref PipelineTable
  ProcessFunctionName:
    Description: Process Lambda (check its logs in CloudWatch)
    Value: !Ref ProcessFunction
