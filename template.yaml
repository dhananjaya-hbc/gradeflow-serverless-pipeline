AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  GradeFlow - serverless data pipeline for education analytics.
  Phase 3: S3 upload -> SQS (+DLQ) -> process Lambda (validate, clean, stats; skips duplicate
  files, quarantines broken ones) -> Parquet in S3 + DynamoDB.

Parameters:
  MinValidRatio:
    Type: Number
    Default: 0.8
    MinValue: 0
    MaxValue: 1
    Description: Minimum share of valid rows for a dataset to be COMPLETED (0-1).
  PassMark:
    Type: Number
    Default: 50
    MinValue: 0
    MaxValue: 100
    Description: Scores at or above this count as a pass (0-100).
  PandasLayerArn:
    Type: String
    # AWS SDK for pandas 3.17.1 (pandas, numpy, pyarrow), published by AWS for
    # ap-south-1 / Python 3.12 / arm64. List for other regions:
    # https://aws-sdk-pandas.readthedocs.io/en/stable/layers.html
    Default: arn:aws:lambda:ap-south-1:336392948345:layer:AWSSDKPandas-Python312-Arm64:31
    Description: ARN of the AWS SDK for pandas managed Lambda layer.

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64] # Graviton: ~20% cheaper than x86 for the same work
    MemorySize: 256
    Timeout: 60
    CodeUri: src/ # every zip Lambda shares the gradeflow package

Resources:
  # --- Storage ---------------------------------------------------------------------

  RawBucket:
    Type: AWS::S3::Bucket
    # S3 validates the queue's permissions when it creates the notification, so the queue
    # policy must exist first.
    DependsOn: UploadQueuePolicy
    Properties:
      # Account ID + region keep the name globally unique; resolved at deploy time.
      BucketName: !Sub "${AWS::StackName}-raw-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteRawFilesAfter30Days
            Status: Enabled
            ExpirationInDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt UploadQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/

  ProcessedBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Cleaned Parquet output: processed/<dataset_id>/data.parquet. Kept (no expiry).
      BucketName: !Sub "${AWS::StackName}-processed-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  QuarantineBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Copies of rejected files: quarantine/<dataset_id>/<filename>. For inspection only.
      BucketName: !Sub "${AWS::StackName}-quarantine-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteQuarantinedFilesAfter30Days
            Status: Enabled
            ExpirationInDays: 30

  PipelineTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST # on-demand: pay per request, nothing when idle
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1 # list datasets by upload time
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection:
            ProjectionType: ALL

  # --- Queues ----------------------------------------------------------------------

  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600 # 14 days (the maximum) to investigate failures
      SqsManagedSseEnabled: true

  UploadQueue:
    Type: AWS::SQS::Queue
    Properties:
      # AWS recommends at least 6x the consumer's timeout (120 s) so a slow run is not
      # delivered to a second Lambda while still processing.
      VisibilityTimeout: 720
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 3 # after 3 failed receives the message moves to the DLQ

  UploadQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref UploadQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowRawBucketToSendUploadEvents
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt UploadQueue.Arn
            Condition:
              # The bucket ARN is built as a string (not !GetAtt RawBucket.Arn): the bucket
              # depends on this policy, so referencing it would be a circular dependency.
              ArnEquals:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:s3:::${AWS::StackName}-raw-${AWS::AccountId}-${AWS::Region}"
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  # --- Processing ------------------------------------------------------------------

  ProcessFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Validates, cleans and summarises uploaded datasets (one SQS message at a time).
      Handler: gradeflow.entrypoints.process_handler.handler
      MemorySize: 512 # pandas needs more memory; more memory also means more CPU
      Timeout: 120
      Layers:
        - !Ref PandasLayerArn
      Environment:
        Variables:
          TABLE_NAME: !Ref PipelineTable
          PROCESSED_BUCKET: !Ref ProcessedBucket
          QUARANTINE_BUCKET: !Ref QuarantineBucket
          MIN_VALID_RATIO: !Ref MinValidRatio
          PASS_MARK: !Ref PassMark
      Policies:
        # Least privilege: read only the raw bucket, write only the processed and quarantine
        # buckets, and only the DynamoDB actions the code uses, on this table only.
        # (For the SQS event SAM also attaches the AWS-managed AWSLambdaSQSQueueExecutionRole,
        # which covers every queue in the account: to be tightened in the Phase 8 IAM review.)
        - S3ReadPolicy:
            BucketName: !Ref RawBucket
        - S3WritePolicy:
            BucketName: !Ref ProcessedBucket
        - S3WritePolicy:
            BucketName: !Ref QuarantineBucket
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem # META, hash claim (conditional put)
                - dynamodb:GetItem # read the owner of a claimed hash
                - dynamodb:Query # find STATS# items to delete
                - dynamodb:DeleteItem # delete old STATS# items
                - dynamodb:BatchWriteItem # batch_writer for stats puts and deletes
              Resource: !GetAtt PipelineTable.Arn
      Events:
        UploadedFile:
          Type: SQS
          Properties:
            Queue: !GetAtt UploadQueue.Arn
            BatchSize: 1 # one upload per call, so a failure retries exactly that upload

  ProcessFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProcessFunction}"
      RetentionInDays: 14 # default is "never expire", which slowly costs money

Outputs:
  RawBucketName:
    Description: Upload files to s3://<this bucket>/uploads/<dataset_id>/<filename>
    Value: !Ref RawBucket
  ProcessedBucketName:
    Description: Cleaned data as Parquet, at processed/<dataset_id>/data.parquet
    Value: !Ref ProcessedBucket
  QuarantineBucketName:
    Description: Copies of rejected files, at quarantine/<dataset_id>/<filename>
    Value: !Ref QuarantineBucket
  UploadQueueUrl:
    Description: Queue that receives S3 upload events
    Value: !Ref UploadQueue
  DeadLetterQueueUrl:
    Description: Messages that failed 3 times end up here
    Value: !Ref DeadLetterQueue
  PipelineTableName:
    Description: DynamoDB table with dataset metadata and statistics
    Value: !Ref PipelineTable
  ProcessFunctionName:
    Description: Process Lambda (check its logs in CloudWatch)
    Value: !Ref ProcessFunction
