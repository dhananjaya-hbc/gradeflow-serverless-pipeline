  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-lambda-errors"
      AlarmDescription: >
        A pipeline or API Lambda raised an error (after its own retries, a step is retried by
        Step Functions up to 3 times). Open the dashboard, then search the function's log group
        for level = "ERROR".
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 1
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      TreatMissingData: notBreaching # a Lambda that was not called publishes no data: not a problem
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]
      Metrics:
        - Id: total
          Expression: SUM(METRICS())
          Label: Errors in any function
          ReturnData: true
        - Id: m1
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref TriggerFunction
            Period: 300
            Stat: Sum
        - Id: m2
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref ValidateFunction
            Period: 300
            Stat: Sum
        - Id: m3
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref CleanFunction
            Period: 300
            Stat: Sum
        - Id: m4
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref StatsFunction
            Period: 300
            Stat: Sum
        - Id: m5
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref AnomaliesFunction
            Period: 300
            Stat: Sum
        - Id: m6
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref StoreFunction
            Period: 300
            Stat: Sum
        - Id: m7
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref FailFunction
            Period: 300
            Stat: Sum
        - Id: m8
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref ApiFunction
            Period: 300
            Stat: Sum

  LambdaThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-lambda-throttles"
      AlarmDescription: >
        Lambda refused to start a function because the account's concurrency limit (10 on a new
        account) was reached. Raise the Lambda concurrency quota (see the README's Limits).
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 1
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]
      Metrics:
        - Id: total
          Expression: SUM(METRICS())
          Label: Throttles in any function
          ReturnData: true
        - Id: m1
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions:
                - Name: FunctionName
                  Value: !Ref TriggerFunction
            Period: 300
            Stat: Sum
        - Id: m2
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions:
                - Name: FunctionName
                  Value: !Ref ValidateFunction
            Period: 300
            Stat: Sum
        - Id: m3
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions:
                - Name: FunctionName
                  Value: !Ref CleanFunction
            Period: 300
            Stat: Sum
        - Id: m4
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions:
                - Name: FunctionName
                  Value: !Ref StatsFunction
            Period: 300
            Stat: Sum
        - Id: m5
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions:
                - Name: FunctionName
                  Value: !Ref AnomaliesFunction
            Period: 300
            Stat: Sum
        - Id: m6
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions:
                - Name: FunctionName
                  Value: !Ref StoreFunction
            Period: 300
            Stat: Sum
        - Id: m7
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions:
                - Name: FunctionName
                  Value: !Ref FailFunction
            Period: 300
            Stat: Sum
        - Id: m8
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions:
                - Name: FunctionName
                  Value: !Ref ApiFunction
            Period: 300
            Stat: Sum

  DeadLetterQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-dead-letter-queue"
      AlarmDescription: >
        An upload event failed 3 times and was parked in the dead-letter queue (kept 14 days).
        Receive the message to see what it was, fix the cause, then purge the queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt DeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 1
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  ApiServerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-api-server-errors"
      AlarmDescription: >
        The API answered 5XX three or more times in 5 minutes. This counts every 5XX including
        the ones API Gateway makes when Lambda is throttled, which our own code never sees.
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: !Sub "${AWS::StackName}-api"
        - Name: Stage
          Value: v1
      Statistic: Sum
      Period: 300
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 3
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  # Only CloudWatch alarms of this stack, in this account, may publish to the alert topic.
  # (Step Functions publishes through its own role, so it needs nothing here.)
  AlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlertTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowThisStacksAlarmsToPublish
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlertTopic
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref AWS::AccountId
              ArnLike:
                "aws:SourceArn": !Sub "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${AWS::StackName}-*"

  # Log groups with a retention (the default is "never expire", which slowly costs money).
  TriggerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${TriggerFunction}"
      RetentionInDays: 14
  ValidateFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ValidateFunction}"
      RetentionInDays: 14
  CleanFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${CleanFunction}"
      RetentionInDays: 14
  StatsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${StatsFunction}"
      RetentionInDays: 14
  AnomaliesFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AnomaliesFunction}"
      RetentionInDays: 14
  StoreFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${StoreFunction}"
      RetentionInDays: 14
  FailFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${FailFunction}"
      RetentionInDays: 14
  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ApiFunction}"
      RetentionInDays: 14

Outputs:
  RawBucketName:
    Description: Upload files to s3://<this bucket>/uploads/<dataset_id>/<filename>
    Value: !Ref RawBucket
  ProcessedBucketName:
    Description: Cleaned data as Parquet, at processed/<dataset_id>/data.parquet
    Value: !Ref ProcessedBucket
  QuarantineBucketName:
    Description: Copies of rejected files, at quarantine/<dataset_id>/<filename>
    Value: !Ref QuarantineBucket
  UploadQueueUrl:
    Description: Queue that receives S3 upload events
    Value: !Ref UploadQueue
  DeadLetterQueueUrl:
    Description: Messages that failed 3 times end up here
    Value: !Ref DeadLetterQueue
  PipelineTableName:
    Description: DynamoDB table with dataset metadata and statistics
    Value: !Ref PipelineTable
  PipelineStateMachineArn:
    Description: The workflow; open it in the Step Functions console to see each run
    Value: !Ref PipelineStateMachine
  AlertTopicArn:
    Description: Failure alerts are published here
    Value: !Ref AlertTopic
  AnomaliesFunctionName:
    Description: Anomalies Lambda, a container image (check its logs in CloudWatch)
    Value: !Ref AnomaliesFunction
  ApiUrl:
    Description: Base URL of the Analytics API. Add a route, and send the x-api-key header.
    Value: !Sub "https://${AnalyticsApi}.execute-api.${AWS::Region}.amazonaws.com/v1"
  ApiKeyId:
    Description: >
      ID of the API key. Its value is a secret: fetch it with
      aws apigateway get-api-key --api-key <this id> --include-value --query value --output text
    Value: !Ref AnalyticsApiApiKey
  TriggerFunctionName:
    Description: Trigger Lambda (reads the queue; check its logs in CloudWatch)
    Value: !Ref TriggerFunction
  DashboardUrl:
    Description: Open this address to use the dashboard (HTTPS, served by CloudFront).
    Value: !Sub "https://${DashboardDistribution.DomainName}"
  DashboardBucketName:
    Description: Private bucket holding the dashboard build (filled by scripts/deploy_dashboard.sh)
    Value: !Ref DashboardBucket
  DashboardDistributionId:
    Description: CloudFront distribution of the dashboard (the deploy script invalidates its cache)
    Value: !Ref DashboardDistribution
  PipelineDashboardUrl:
    Description: The CloudWatch dashboard of the pipeline (open it in the AWS console).
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${PipelineDashboard}"
